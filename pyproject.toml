[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-sales-customer-analytics"
version = "0.1.0"
description = "Reproducible retail sales and customer analytics study using the UCI Online Retail II dataset."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0,<26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a PostgreSQL integration environment",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
